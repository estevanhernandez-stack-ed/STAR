<!-- The rail's own mark, at 32 pixels.

     `web/index.html` opens with <span class="star-mark">✶</span> on cabinet
     green, and this is that same mark drawn as geometry rather than as a glyph
     — a favicon cannot rely on a self-hosted font, and the zero-third-party
     rule means it will never fetch one.

     Palette straight from web/tokens.css and nothing new: --cabinet #232B27
     behind, --manila #D2B98C for the mark, --aniline #5C3D91 for the single
     filed stamp at its centre. Flat fills only. DIRECTION's rule against
     gradients is not a stylesheet rule, it is the design's, and a favicon is
     the easiest place in a project to quietly break it.

     BOLDER THAN THE RAIL'S GLYPH, on purpose. The first cut traced the ✶ at
     its printed weight and measured 6% mark coverage at 16 pixels, which reads
     in a tab and a connector list as a dark square with something in it. At
     4.6 units it measures 18%. A favicon is not a small version of a wordmark,
     it is a different drawing of the same idea.

     Drawn on a 32-unit grid with a full-bleed ground, because a transparent
     favicon inverts against a dark client chrome and this mark is manila-on-
     green in every other place it appears. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img"
     aria-label="STAR">
  <rect width="32" height="32" rx="5" fill="#232B27"/>
  <!-- Six points: one vertical bar, two crossed diagonals. The same six-armed
       ✶ the rail prints, kept as three strokes so it stays legible at 16px
       where a filled star closes up into a blob. -->
  <g stroke="#D2B98C" stroke-width="4.6" stroke-linecap="round">
    <line x1="16" y1="4" x2="16" y2="28"/>
    <line x1="5.6" y1="9.9" x2="26.4" y2="22.1"/>
    <line x1="5.6" y1="22.1" x2="26.4" y2="9.9"/>
  </g>
  <!-- The stamp. Aniline, flat, centred: filed. -->
  <circle cx="16" cy="16" r="4.6" fill="#5C3D91"/>
</svg>
