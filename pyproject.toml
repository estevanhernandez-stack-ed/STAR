[project]
name = "star"
version = "0.1.0"
description = "STAR - Story & Treatment Agentic Research. A multi-agent research department for screenwriters: Google ADK + Gemini + Parallel Search API."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Estevan Hernandez" }]
# Pinned exactly, deliberately. A Cloud Run build runs a fresh install and
# would otherwise take whatever shipped that morning. ADK 2.6.2 warns that
# SequentialAgent and ParallelAgent are deprecated in favor of Workflow, and
# that Workflow cannot yet be an LlmAgent sub-agent — so there is no migration
# path today and a floating major would break Pipeline A outright.
# Revisit after the 2026-09-07 deadline.
dependencies = [
    "google-adk==2.6.2",
    "google-genai==2.17.0",
    "parallel-web==1.1.0",
    "pydantic==2.13.4",
    "python-dotenv==1.2.2",
    "fastapi==0.141.1",
    "uvicorn[standard]==0.52.1",
    "firebase-admin==7.5.0",
    # star/store.py imports this directly; firebase-admin only pulls it in
    # transitively, so without an explicit pin here a fresh Cloud Run build
    # floats to whatever ships that morning. Pinned to the version installed
    # in this repo's venv (`pip show google-cloud-firestore`).
    "google-cloud-firestore==2.28.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "ruff>=0.5", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
extend-select = ["E402"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
# EXPLICIT, not `find`. A package missing from this list is not a build error:
# `pip install .` inside the Cloud Build simply omits it, the local venv keeps
# working because it resolves the package off the source tree, and the deployed
# image 500s on the first import. "star.mcp" is here for that reason and for no
# other.
packages = [
    "star",
    "star.agents",
    "star.mcp",
    "star.oauth",
    "star.tools",
    "research_dept",
]
